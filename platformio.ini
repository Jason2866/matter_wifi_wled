; PlatformIO Project Configuration
; Matter WiFi WLED Bridge
; Presents WLED devices as Matter Extended Color Lights
; (Apple Home, Google Home, Alexa compatible)
; and controls them via the WLED JSON API over HTTP.
;
; Uses dual framework (arduino + espidf) so that the IDF Component Manager
; resolves esp_matter natively, compiling it from source WITHOUT BLE support.
; This avoids the BT controller crash that occurs with precompiled libs.
;
; Build targets:
;   pio run -e esp32s3      # ESP32-S3 with 8MB flash (default)
;   pio run -e esp32        # Classic ESP32 with 8MB flash
;   pio run -e esp32s3_16mb # ESP32-S3 with 16MB flash (N16R8)
;   pio run -e esp32_4mb    # Classic ESP32 with 4MB flash (experimental)

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
platform_packages =
framework = arduino, espidf
board_build.filesystem = littlefs

monitor_speed = 115200

; --- OTA upload support ---
; To upload via OTA: pio run -t upload --upload-port matterwled.local
; Or specify IP directly: pio run -t upload --upload-port 192.168.x.x

; --- Dependencies ---
lib_deps =
  bblanchon/ArduinoJson@^7.0.0

; Ignore Arduino's built-in Matter library (conflicts with esp_matter from IDF)
lib_ignore =
  Matter

; --- Build flags ---
build_flags =
  -DFIRMWARE_VERSION=\"0.1.0\"
  -DFIRMWARE_RELEASE_NAME=\"MatterWiFiWLED\"
  -DCORE_DEBUG_LEVEL=3
  ; Maximum number of configurable lights
  -DMAX_LIGHTS=16
  ; Matter commissioning defaults (change before production)
  -DMATTER_DEFAULT_PASSCODE=20202021
  -DMATTER_DEFAULT_DISCRIMINATOR=3840
  ; Matter task config
  -DMATTER_TASK_STACK_SIZE=16384
  -DMATTER_TASK_PRIORITY=5
  ; GCC 14 compatibility workaround for CHIP SDK
  -include matter_gcc14_compat.h
  ;; WiFi-only rendezvous – BLE transport compiled out by IDF component build.
  ;; CONFIG_BT_ENABLED is not set in sdkconfig; do NOT define it here
  ;; (even as =0) because #ifdef checks in managed_components would match.
  -DCONFIG_RENDEZVOUS_MODE_WIFI=1
  ;; CHIP SDK: enable generated build-config headers
  -DCHIP_HAVE_CONFIG_H=1
build_unflags =
  -DCORE_DEBUG_LEVEL=0
  -D CORE_DEBUG_LEVEL=0

; Log ring buffer flags scoped to user sources only (avoids sdkconfig.h redefinition
; warnings-as-errors in ESP-IDF C files)
build_src_flags =
  -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
  -DCONFIG_LOG_MAXIMUM_LEVEL=5
  -DUSE_ESP_IDF_LOG

board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

; --- Build scripts ---
extra_scripts =
  pre:fix_nodelist.py
  pre:setup_matter_component.py
  post:generate_embed_files.py

; ─────────────────────────────────────────────────────────────────────────────
; ESP32-S3 with 8MB Flash (default target)
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.partitions = partitions/matter_wled_8MB.csv
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
upload_speed = 921600

; ─────────────────────────────────────────────────────────────────────────────
; ESP32-S3 with 16MB Flash + 8MB OPI PSRAM (N16R8 variant)
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32s3_16mb]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions/matter_wled_16MB.csv
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
upload_speed = 921600

; ─────────────────────────────────────────────────────────────────────────────
; Classic ESP32 with 8MB Flash
; Note: IRAM may be tight — this target is experimental.
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32]
board = esp32dev
board_build.partitions = partitions/matter_wled_8MB.csv
board_build.flash_mode = dio
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
upload_speed = 921600

; ─────────────────────────────────────────────────────────────────────────────
; Classic ESP32 with 4MB Flash — single app partition, no OTA
; Matter firmware (~2MB) fits in the 3.375MB factory partition.
; USB flashing only; OTA updates are not supported on this target.
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32_4mb]
board = esp32dev
board_build.partitions = partitions/matter_wled_4MB.csv
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_upload.maximum_size = 3538944
upload_speed = 921600
