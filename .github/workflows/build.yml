name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: esp32s3
            chip_family: ESP32-S3
            bootloader_offset: 0
          - env: esp32
            chip_family: ESP32
            bootloader_offset: 4096

    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: Prepare artifacts
        run: |
          mkdir -p release
          cp .pio/build/${{ matrix.env }}/bootloader.bin    release/bootloader.bin
          cp .pio/build/${{ matrix.env }}/partitions.bin     release/partitions.bin
          cp .pio/build/${{ matrix.env }}/firmware.bin        release/firmware.bin
          if [ -f .pio/build/${{ matrix.env }}/boot_app0.bin ]; then
            cp .pio/build/${{ matrix.env }}/boot_app0.bin release/boot_app0.bin
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: release/

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download ESP32-S3 firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32s3
          path: firmware-esp32s3

      - name: Download ESP32 firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32
          path: firmware-esp32

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build pages site
        run: |
          mkdir -p site/esp32s3 site/esp32

          # Copy firmware binaries into per-target directories
          cp firmware-esp32s3/bootloader.bin site/esp32s3/
          cp firmware-esp32s3/partitions.bin site/esp32s3/
          cp firmware-esp32s3/firmware.bin   site/esp32s3/
          [ -f firmware-esp32s3/boot_app0.bin ] && cp firmware-esp32s3/boot_app0.bin site/esp32s3/

          cp firmware-esp32/bootloader.bin site/esp32/
          cp firmware-esp32/partitions.bin site/esp32/
          cp firmware-esp32/firmware.bin   site/esp32/
          [ -f firmware-esp32/boot_app0.bin ] && cp firmware-esp32/boot_app0.bin site/esp32/

          VERSION="${{ steps.version.outputs.version }}"

          # ESP32-S3: bootloader@0x0, partitions@0x8000, otadata@0xE000, app@0x10000
          BOOT_APP0_S3=""
          [ -f firmware-esp32s3/boot_app0.bin ] && BOOT_APP0_S3='{"path": "esp32s3/boot_app0.bin", "offset": 57344},'

          # ESP32: bootloader@0x1000, partitions@0x8000, otadata@0xE000, app@0x10000
          BOOT_APP0_32=""
          [ -f firmware-esp32/boot_app0.bin ] && BOOT_APP0_32='{"path": "esp32/boot_app0.bin", "offset": 57344},'

          cat > site/manifest.json << MANIFEST
          {
            "name": "Matter WLED Bridge",
            "version": "${VERSION}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "esp32s3/bootloader.bin", "offset": 0 },
                  { "path": "esp32s3/partitions.bin", "offset": 32768 },
                  ${BOOT_APP0_S3}
                  { "path": "esp32s3/firmware.bin",   "offset": 65536 }
                ]
              },
              {
                "chipFamily": "ESP32",
                "parts": [
                  { "path": "esp32/bootloader.bin", "offset": 4096 },
                  { "path": "esp32/partitions.bin", "offset": 32768 },
                  ${BOOT_APP0_32}
                  { "path": "esp32/firmware.bin",   "offset": 65536 }
                ]
              }
            ]
          }
          MANIFEST

          # Copy the installer page
          cp docs/install/index.html site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download ESP32-S3 firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32s3
          path: firmware-esp32s3

      - name: Download ESP32 firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32
          path: firmware-esp32

      - name: Prepare release assets
        run: |
          mkdir -p release
          for f in firmware-esp32s3/*; do
            cp "$f" "release/esp32s3-$(basename $f)"
          done
          for f in firmware-esp32/*; do
            cp "$f" "release/esp32-$(basename $f)"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
