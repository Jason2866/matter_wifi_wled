name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: esp32s3
            chip_family: ESP32-S3
          - env: esp32
            chip_family: ESP32

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false
      - name: Install pio
        run: |
          uv pip install --system pioarduino

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: Prepare artifacts
        run: |
          mkdir -p release
          cp .pio/build/${{ matrix.env }}/firmware.factory.bin        release/firmware.factory.bin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: release/

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download ESP32-S3 firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32s3
          path: firmware-esp32s3

      - name: Download ESP32 firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32
          path: firmware-esp32

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build pages site
        run: |
          mkdir -p site/esp32s3 site/esp32

          # Copy firmware binaries into per-target directories
          cp firmware-esp32s3/firmware.factory.bin   site/esp32s3/
          cp firmware-esp32/firmware.factory.bin  site/esp32/

          VERSION="${{ steps.version.outputs.version }}"


          cat > site/manifest.json << MANIFEST
          {
            "name": "Matter WLED Bridge",
            "version": "${VERSION}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "esp32s3/firmware.factory.bin",   "offset": 0 }
                ]
              },
              {
                "chipFamily": "ESP32",
                "parts": [
                  { "path": "esp32/firmware.factory.bin",   "offset": 0 }
                ]
              }
            ]
          }
          MANIFEST

          # Copy the installer page
          cp docs/install/index.html site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download ESP32-S3 firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32s3
          path: firmware-esp32s3

      - name: Download ESP32 firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32
          path: firmware-esp32

      - name: Prepare release assets
        run: |
          mkdir -p release
          for f in firmware-esp32s3/*; do
            cp "$f" "release/esp32s3-$(basename $f)"
          done
          for f in firmware-esp32/*; do
            cp "$f" "release/esp32-$(basename $f)"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
